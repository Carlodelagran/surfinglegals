name: Validar compilación del Worker IMPI
on:
  push:
    branches: [feature/consulta-marca-v1]
    paths:
      - 'workers/impi-browser/**'
      - '.github/workflows/impi-browser-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: workers/impi-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias reales de Cloudflare
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Validar JavaScript del Worker
        run: node --check src/index.mjs
      - name: Compilar sin desplegar ni modificar Cloudflare
        run: npx wrangler deploy --dry-run --outdir dist
